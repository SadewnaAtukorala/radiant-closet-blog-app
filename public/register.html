<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | The Radiant Closet</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<main>

    <section class="auth-page">


        <!-- REGISTER HEADER -->

        <div class="auth-header">

            <p class="eyebrow">
                THE RADIANT CLOSET
            </p>

            <h1>
                Create Your Account
            </h1>

            <p>
                Join The Radiant Closet and start sharing your stories.
            </p>

        </div>


        <!-- REGISTER CARD -->

        <div class="auth-card">


            <form
                action="../auth/register.php"
                method="POST"
                class="auth-form"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>


    </section>

</main>


</body>

</html>
