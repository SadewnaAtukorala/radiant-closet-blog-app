<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | The Radiant Closet</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<main>

    <section class="auth-page">

        <div class="auth-header">

            <p class="eyebrow">
                THE RADIANT CLOSET
            </p>

            <h1>
                Forgot Your Password?
            </h1>

            <p>
                Enter your email address and we'll help you reset your password.
            </p>

        </div>

        <div class="auth-card">

            <form
                action="../auth/forgot-password.php"
                method="POST"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Send Reset Link
                </button>

            </form>

            <p class="auth-footer">

                <a href="login.html">
                    ← Back to Login
                </a>

            </p>

        </div>

    </section>

</main>

</body>

</html>
